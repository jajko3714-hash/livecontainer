name: Custom Launcher Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Package Custom OS Shell
    runs-on: macos-14
    steps:
      - name: Checkout Your Repository Code
        uses: actions/checkout@v4

      - name: Setup Pristine Apple Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Inject Custom Web Interface Link
        run: |
          # Automatically finds your LCTabView.swift file inside your layout and updates the URL
          TARGET_FILE=$(find . -name "LCTabView.swift" | head -n 1)
          if [ -f "$TARGET_FILE" ]; then
            echo "Injecting into layout file at: $TARGET_FILE"
            cat << 'EOF' > "$TARGET_FILE"
            import SwiftUI
            import WebKit

            struct LCWebLauncherView: UIViewRepresentable {
                let url: URL
                func makeUIView(context: Context) -> WKWebView {
                    let config = WKWebViewConfiguration()
                    let ctrl = WKUserContentController()
                    ctrl.add(context.coordinator, name: "launchFilePicker")
                    ctrl.add(context.coordinator, name: "launchApp")
                    ctrl.add(context.coordinator, name: "deleteApp")
                    config.userContentController = ctrl
                    let webView = WKWebView(frame: .zero, configuration: config)
                    webView.scrollView.isScrollEnabled = false
                    webView.backgroundColor = .clear
                    webView.isOpaque = false
                    return webView
                }
                func updateUIView(_ uiView: WKWebView, context: Context) {
                    uiView.load(URLRequest(url: url))
                }
                func makeCoordinator() -> Coordinator { Coordinator(self) }
                class Coordinator: NSObject, WKScriptMessageHandler {
                    var parent: LCWebLauncherView
                    init(_ parent: LCWebLauncherView) { self.parent = parent }
                    func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                        if message.name == "launchFilePicker" {
                            NotificationCenter.default.post(name: NSNotification.Name("LC_TriggerFilePicker"), object: nil)
                        } else if message.name == "launchApp", let bundleID = message.body as? String {
                            NotificationCenter.default.post(name: NSNotification.Name("LC_LaunchAppWithBundleID"), object: bundleID)
                        } else if message.name == "deleteApp", let bundleID = message.body as? String {
                            NotificationCenter.default.post(name: NSNotification.Name("LC_DeleteAppWithBundleID"), object: bundleID)
                        }
                    }
                }
            }

            struct LCTabView: View {
                var body: some View {
                    ZStack {
                        Color.black.edgesIgnoringSafeArea(.all)
                        LCWebLauncherView(url: URL(string: "https://github.io")!)
                            .edgesIgnoringSafeArea(.all)
                    }
                }
            }
          EOF
          else
            echo "Error: Layout configuration file missing."
            exit 1
          fi

      - name: Build Fixed Native IPA Package
        run: |
          # Compiles just the basic visual app shell without processing deep virtualization submodules
          xcodebuild -project LiveContainer.xcodeproj -scheme LiveContainer -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO archive -archivePath LiveContainer.xcarchive
          mkdir -p Payload
          cp -R LiveContainer.xcarchive/Products/Applications/LiveContainer.app Payload/
          zip -r LiveContainer.ipa Payload
          
      - name: Export Ready-To-Sideload Binary Package
        uses: actions/upload-artifact@v4
        with:
          name: CustomLauncher-Unsigned-IPA
          path: LiveContainer.ipa
