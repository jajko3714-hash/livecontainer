name: Custom Launcher Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Package Custom OS Shell
    runs-on: macos-14
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Build Engine
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Infrastructure Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "CustomOS" "com.jajko3714hash.customlauncher" --web-dir=. --confirm

      - name: Generate Native Apple Directory Frameworks
        run: npx cap add ios

      - name: Sync Web Code Into App Container Shell
        run: npx cap sync ios

      - name: Compile and Bundle IPA Package File
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO archive -archivePath App.xcarchive
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -r ../../LiveContainer.ipa Payload
          
      - name: Export Ready-To-Sideload Binary Package
        uses: actions/upload-artifact@v4
        with:
          name: CustomLauncher-Unsigned-IPA
          path: LiveContainer.ipa   
