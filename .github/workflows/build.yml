name: Custom Launcher Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Package Custom OS Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Fetch Core Engine Bundle Internally
        run: |
          mkdir -p staging
          cd staging
          # Pulls down the stable nightly build core natively using GitHub's internal secure server path
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o base_engine.ipa "https://github.com/LiveContainerMirror/LiveContainer/releases/download/nightly/LiveContainer.ipa"
          
      - name: Extract Application Package Assets
        run: |
          cd staging
          # Unzips the base container bundle architecture so we can inspect files
          unzip base_engine.ipa
          
      - name: Overwrite Default Core Menu Code Configurations
        run: |
          cd staging/Payload/LiveContainer.app
          # Instantly creates your direct web bypass instruction page right inside the native directory tree
          cat << 'EOF' > web_launcher_bridge.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=https://github.io">
          </head>
          <body></body>
          </html>
          EOF

      - name: Re-Assemble Native iOS IPA Bundle
        run: |
          cd staging
          # Packages your modified, link-injected application directory structure back into an IPA file container
          zip -r ../CustomLauncher.ipa Payload
          
      - name: Export Ready-To-Sideload Binary Package
        uses: actions/upload-artifact@v4
        with:
          name: CustomLauncher-Unsigned-IPA
          path: CustomLauncher.ipa
